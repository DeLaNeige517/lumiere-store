name: 功能建议
description: 提出新的模块、交互或视觉改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以附上草图、参考链接或设计说明
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充说明
